<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Générateur d'IMEI de test </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Générateur d'IMEI de test</h1>
    <p class="warning">
     
    </p>

    <div class="controls">
      <div>
        <label for="amount">Nombre d'emei(1 à 100)</label>
        <input id="amount" type="number" min="1" max="100" value="10">
      </div>
      <div>
        <label for="prefix">Préfixe numérique facultatif (1 à 14 chiffres)</label>
        <input id="prefix" type="text" inputmode="numeric" maxlength="14" placeholder="Ex. : 35693803">
      </div>
    </div>

    <div class="actions">
      <button id="generate">Générer des IMEI</button>
      <button id="selectAll" class="secondary" type="button">Tout sélectionner</button>
      <button id="copy" class="secondary" type="button">Copier la sélection</button>
    </div>

    <div id="progressWrap" class="progress-wrap" hidden>
      <div class="progress-track">
        <div id="progressBar" class="progress-bar" role="progressbar"
             aria-valuemin="1" aria-valuemax="100" aria-valuenow="1"></div>
      </div>
      <div id="progressLabel" class="progress-label">1%</div>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <ul id="results" aria-label="Valeurs générées"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
