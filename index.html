
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Free Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0b0e1a 0%, #1a1f35 100%);
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
            max-width: 500px;
            width: 90%;
        }

        .title {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7a5cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .btn {
            background: linear-gradient(135deg, #00d4ff, #7a5cff);
            border: none;
            padding: 18px 55px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 35px rgba(0, 212, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn.loading .spinner {
            display: block;
        }
        .btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            margin-top: 30px;
            padding: 16px 20px;
            border-radius: 16px;
            background: rgba(0, 212, 255, 0.08);
            border-left: 4px solid #00d4ff;
            color: rgba(255, 255, 255, 0.85);
            font-size: 1rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .message .icon {
            font-size: 1.4rem;
        }

        .message.success {
            border-left-color: #00d4ff;
            background: rgba(0, 212, 255, 0.12);
        }

        .message.error {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.12);
        }

        .badge {
            margin-top: 25px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">📶 Data Free Data</div>
    <div class="subtitle">⚡ Offre spéciale</div>

    <button class="btn" id="btnFetch">
        <span class="btn-text">🔓 Obtenir 512 Mo</span>
        <span class="spinner"></span>
    </button>

    <div class="message" id="message">
        <span class="icon">✅</span>
        <span id="msgText">512 Mo réseau avec succès</span>
    </div>

    <div class="badge">• ayoba • v2</div>
</div>

<script>
    const btn = document.getElementById('btnFetch');
    const messageEl = document.getElementById('message');
    const msgText = document.getElementById('msgText');

    btn.addEventListener('click', function() {
        btn.disabled = true;
        btn.classList.add('loading');
        messageEl.classList.remove('show', 'success', 'error');

        // Utilisation d'un proxy CORS pour contourner le blocage
        const proxyUrl = 'https://corsproxy.io/?';
        const targetUrl = 'http://id.ayoba.me/v2/subscribers/msisdn';

        const headers = new Headers();
        headers.append('User-Agent', 'okhttp/3.12.12');
        headers.append('Connection', 'Keep-Alive');
        headers.append('Accept-Encoding', 'gzip');

        const options = {
            method: 'GET',
            headers: headers
        };

        fetch(proxyUrl + encodeURIComponent(targetUrl), options)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.text();
            })
            .then(result => {
                console.log('Résultat:', result);
                msgText.textContent = '512 Mo réseau avec succès ✅';
                messageEl.className = 'message show success';
            })
            .catch(error => {
                console.error('Erreur:', error);
                msgText.textContent = '512 Mo🚀: ' + error.message;
                messageEl.className = 'message show error';
            })
            .finally(() => {
                btn.disabled = false;
                btn.classList.remove('loading');
            });
    });
</script>

</body>
</html>
